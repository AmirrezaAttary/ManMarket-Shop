{% load static %}
{% load humanize %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>افزایش موجودی کیف پول</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="body-f">

    <div class="ws-cs-container">
        <h2>افزایش موجودی کیف پول</h2>

        <div class="ws-cs-wallet-info">
            <img src="https://cdn-icons-png.flaticon.com/512/1170/1170576.png" alt="wallet icon" />
            <span>موجودی فعلی: {{ wallet.balance|floatformat:0|intcomma }} تومان</span>
        </div>

        <form method="post">
            {% csrf_token %}
            <label for="amount" class="ws-cs-label">مبلغ مورد نظر خودرا وارد کنید</label>
            <input type="text" id="amount" name="amount" placeholder="تومان" class="ws-cs-input" required maxlength="11" />
            <p id="amount-in-words" class="text-muted mt-2"></p>
            <button type="submit" class="theme-color w-100 d-block py-3 px-2 rounded-3 text-light mt-3">افزایش
                موجودی</button>

            {% if error %}
            <p class="text-danger mt-2">{{ error }}</p>
            {% endif %}
        </form>



        <div class="ws-cs-tip mt-4">پرداخت‌های شما از طریق درگاه امن بانکی انجام می‌شود.</div>
    </div>

    <script>
        function numberToPersianWords(num) {
            const persianNumbers = [
                "", "یک", "دو", "سه", "چهار", "پنج", "شش", "هفت", "هشت", "نه",
                "ده", "یازده", "دوازده", "سیزده", "چهارده", "پانزده", "شانزده", "هفده", "هجده", "نوزده"
            ];
            const tens = [
                "", "", "بیست", "سی", "چهل", "پنجاه", "شصت", "هفتاد", "هشتاد", "نود"
            ];
            const hundreds = [
                "", "صد", "دویست", "سیصد", "چهارصد", "پانصد", "ششصد", "هفتصد", "هشتصد", "نهصد"
            ];
            const thousands = ["", "هزار", "میلیون", "میلیارد"];

            if (isNaN(num) || num === "") return "";

            if (parseInt(num) === 0) return "صفر";

            let number = parseInt(num).toString();
            let result = [];
            let groupIndex = 0;

            while (number.length > 0) {
                let group = number.slice(-3);
                number = number.slice(0, -3);

                let groupNum = parseInt(group);
                if (groupNum === 0) {
                    groupIndex++;
                    continue;
                }

                let groupWords = [];
                if (group.length === 3) {
                    groupWords.push(hundreds[parseInt(group[0])]);
                    group = group.slice(1);
                }

                if (parseInt(group) < 20) {
                    groupWords.push(persianNumbers[parseInt(group)]);
                } else {
                    groupWords.push(tens[parseInt(group[0])]);
                    groupWords.push(persianNumbers[parseInt(group[1])]);
                }

                let groupText = groupWords.filter(Boolean).join(" و ");
                if (thousands[groupIndex]) {
                    groupText += " " + thousands[groupIndex];
                }

                result.unshift(groupText);
                groupIndex++;
            }

            return result.join(" و ") + " تومان";
        }

        const amountInput = document.getElementById("amount");
        const amountInWords = document.getElementById("amount-in-words");

        amountInput.addEventListener("input", function (e) {
            let raw = e.target.value.replace(/[^0-9]/g, '');

            const maxNum = 2000000000;  // سقف مبلغ 2 میلیارد
            if (raw !== "") {
                if (BigInt(raw) > BigInt(maxNum)) {
                    raw = maxNum.toString();
                }
            }

            if (raw === "") {
                e.target.value = "";
                amountInWords.textContent = "";
                return;
            }

            let formatted = raw.replace(/\B(?=(\d{3})+(?!\d))/g, "٬");
            e.target.value = formatted;

            amountInWords.textContent = numberToPersianWords(raw);
        });



        const form = amountInput.closest("form");
        form.addEventListener("submit", function () {
            amountInput.value = amountInput.value.replace(/[^0-9]/g, '');
        });
    </script>

</body>

</html>
