{% load static %}
{% load humanize %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>افزایش موجودی کیف پول</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body class="body-f">

    <div class="ws-cs-container container">
        <h2>افزایش موجودی کیف پول</h2>

        <div class="ws-cs-wallet-info">
            <img src="https://cdn-icons-png.flaticon.com/512/1170/1170576.png" alt="wallet icon" />
            <span>موجودی فعلی: {{wallet.balance|floatformat:0|intcomma}} تومان</span>
        </div>

        <form method="post">
            {% csrf_token %}
            <label for="amount" class="ws-cs-label">مبلغ مورد نظر (تومان)</label>
            <input type="text" id="amount" name="amount" placeholder="مثلاً ۵۰٬۰۰۰" class="ws-cs-input" required />

            <button type="submit" class="ws-cs-button">ادامه پرداخت</button>
            {% if error %}
            <p class="text-danger">{{ error }}</p>
            {% endif %}
        </form>

        <div class="ws-cs-tip">پرداخت‌های شما از طریق درگاه امن بانکی انجام می‌شود.</div>
    </div>

    <script>
        const amountInput = document.getElementById("amount");

        amountInput.addEventListener("input", function (e) {
            // مقدار بدون کاراکترهای غیر عددی
            let raw = e.target.value.replace(/[^0-9]/g, '');

            if (raw === "") {
                e.target.value = "";
                return;
            }

            // تبدیل به فرمت با ممیز فارسی
            let formatted = raw.replace(/\B(?=(\d{3})+(?!\d))/g, "٬");

            e.target.value = formatted;
        });

        // جلوگیری از ارسال مقدار با ممیزها و ارسال عدد خام
        const form = amountInput.closest("form");
        form.addEventListener("submit", function () {
            amountInput.value = amountInput.value.replace(/[^0-9]/g, '');
        });
    </script>

</body>

</html>
