{% extends 'dashboard/admin/base.html' %}
{% load static %}
{% load humanize %}

{% block extra_css %}
<style>
    .small-primary-button {
        padding: 3px 10px;
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 10px;
        border-radius: 5px;
    }

    .small-primary-button:hover,
    .small-primary-button:focus {
        background-color: #0056b3;
    }
</style>
{% endblock %}


{% block content %}
<br><br><br><br>
<div class="row">
    {% include 'dashboard/admin/sidebar.html' %}
    <div class="col-md-9">
        <div>
            <div class="card mb-5">
                <!-- Header -->
                <div class="card-header border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="card-header-title">ویرایش دسته بندی</h5>
                </div>
                <!-- End Header -->

                <!-- Body -->
                <form action="." method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="card-body">
                        <div class="row d-flex ">
                            <div style="margin-top: 28px;" class="col-md-6 mb-3">
                                <label>نام دسته بندی</label>
                                {{form.name}}
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class=" d-flex pt-5 justify-content-end">
                                <a class="btn btn-danger ms-3"
                                    href="{% url 'dashboard:admin:blog-category-delete' pk=object.pk %}">حذف</a>
                                <a class="btn btn-secondary ms-3"
                                    href="{% url 'dashboard:admin:blog-category-list' %}">بازگشت</a>
                                <button class="btn btn-primary ms-3" type="submit">ثبت تغییرات</button>
                            </div>
                        </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>

    function generateSlug() {
        const title = $("#id_title").val();
        const slug = slugify(title);
        $("#id_slug").val(slug)
    }

    function slugify(titleStr) {
        titleStr = titleStr.replace(/^\s+|\s+$/g, '');
        titleStr = titleStr.toLowerCase();
        //persian support
        titleStr = titleStr.replace(/[^a-z0-9_\s-ءاأإآؤئبتثجحخدذرزسشصضطظعغفقكلمنهويةى]#u/, '')
            // Collapse whitespace and replace by -
            .replace(/\s+/g, '-')
            // Collapse dashes
            .replace(/-+/g, '-');
        slugStr = titleStr;
        return slugStr;
    }
</script>
{% endblock %}
