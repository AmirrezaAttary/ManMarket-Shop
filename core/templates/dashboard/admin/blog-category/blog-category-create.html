{% extends 'base.html' %}
{% load static %}



{% block content %}
<div class="row">
    {% include 'dashboard/admin/sidebar.html' %}
    <!-- Card -->
    <div class="col-md-9 mb-9">
        <!-- Card -->
        <div class="card mb-3">
            <div class="card-header border-bottom">
                <h4 class="card-header-title">ایجاد دسته بندی </h4>
            </div>

            <form action="." method="post">
                <!-- Body -->
                <div class="card-body">
                    <!-- Form -->

                    {% csrf_token %}


                    <!-- Form -->
                    <div class="row">
                        <div style="margin-top: 28px;" class="col-md-6 mb-3">
                            <label>نام دسته بندی</label>
                            {{form.name}}
                        </div>

                    </div>

                    <!-- End Body -->

                    <!-- Footer -->
                    <div class="card-footer pt-0">
                        <div class="d-flex justify-content-end gap-3">
                            <a class="btn btn-secondary" href="{% url 'dashboard:admin:blog-category-list' %}">بازگشت</a>
                            <button class="btn btn-primary" style="background-color: #f96747;border-color: #f96747;" type="submit">ذخیره تغییرات</button>
                        </div>
                    </div>
            </form>
            <!-- End Footer -->
        </div>
        <!-- End Card -->
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>

    function generateSlug() {
        const title = $("#id_title").val();
        const slug = slugify(title);
        $("#id_slug").val(slug)
    }

    function slugify(titleStr) {
        titleStr = titleStr.replace(/^\s+|\s+$/g, '');
        titleStr = titleStr.toLowerCase();
        //persian support
        titleStr = titleStr.replace(/[^a-z0-9_\s-ءاأإآؤئبتثجحخدذرزسشصضطظعغفقكلمنهويةى]#u/, '')
            // Collapse whitespace and replace by -
            .replace(/\s+/g, '-')
            // Collapse dashes
            .replace(/-+/g, '-');
        slugStr = titleStr;
        return slugStr;
    }
</script>
{% endblock %}
