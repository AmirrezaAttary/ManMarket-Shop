{% extends 'base.html' %}
{% load static %}
{% load jformat %}

{% block title %}

{% endblock title %}

{% block content %}
  <center>
    <!-- Main Content Area -->
    <main class="profile-content-area-new" style="width: 800px;">
      <section class="profile-section-new">
        <header class="section-header-new border-0">
          <h2><svg>
              <use xlink:href="#icon-heart-solid"></use>
            </svg>لیست علاقه‌مندی</h2>
        </header>
        <div id="wishlistContainer" class="mt-3">
          <!-- Wishlist items will be populated by JS -->
        </div>
      </section>
    </main>
    </center>
  </div>
</div>



{% endblock content %}

{% block extra_js %}
<script src="{% static 'js/profile.js' %}"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const wishlistContainer = document.getElementById('wishlistContainer');
    if (!wishlistContainer) return;

    let wishlistItems = [
      {% for object in object_list %}
        { id: 'prod1', name: '{{object.product.title}}', price: 1200000, image: '{{object.product.image.url}}', category: '{{object.product.category}}', slug: '{% url 'shop:product-detail' slug=object.product.slug %}',
          form:''
         },
    {% endfor %} 
      ];

  function renderWishlist() {
    wishlistContainer.innerHTML = '';
    if (wishlistItems.length === 0) {
      wishlistContainer.innerHTML = '<p class="text-muted text-center py-5">لیست علاقه‌مندی شما خالی است.</p>';
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'row g-3';
    wishlistItems.forEach(item => {
      const col = document.createElement('div');
      col.className = 'col-md-6';
      col.id = `item-${item.id}`;
      col.innerHTML = `
                    <div class="product-card-minimal">
                        <img src="${item.image}" alt="${item.name}" class="product-card-minimal-img">
                        <div class="product-card-minimal-info">
                            <h6>${item.name}</h6>
                            <p class="category-text">${item.category}</p>
                            <p class="price-text">${item.price.toLocaleString('fa-IR')} <small>تومان</small></p>
                            <div class="product-card-minimal-actions d-flex gap-2">

                                <a href="${item.slug}">
                                  <button  class="btn-custom btn-primary btn-sm">مشاهده محصول</button>
                                  </a>
                            </div>
                        </div>
                    </div>
                    <form hidden id="deleform" action="${item.form}" method="post">{% csrf_token %}</form>`;
      grid.appendChild(col);
    });
    wishlistContainer.appendChild(grid);
  }

  wishlistContainer.addEventListener('click', function (e) {
    const button = e.target.closest('.remove-wishlist-btn');
    if (button) {
      const productId = button.dataset.id;
      showToast({
        type: 'warning',
        title: 'تایید حذف',
        message: 'آیا از حذف این محصول مطمئن هستید؟',
        isConfirm: true,
        onConfirm: () => {
          const productCardWrapper = document.getElementById(`item-${productId}`);
          if (productCardWrapper) {
            productCardWrapper.style.transition = 'all 0.3s ease';
            productCardWrapper.style.opacity = '0';
            productCardWrapper.style.transform = 'scale(0.95)';
            setTimeout(() => {
              wishlistItems = wishlistItems.filter(item => item.id !== productId);
              renderWishlist();
            }, 300);
          }
        }
      });
    }
  });

  renderWishlist();
});
</script>
{% endblock extra_js %}
