{% extends 'dashboard/admin/layout.html' %}
{% load static %}

{% block content %}
<div class="card">
            <!-- Header -->
            <div class="card-header">
                <h5 class="card-header-title">حذف محصول ثبت شده</h5>
            </div>
            <!-- End Header -->

            <!-- Body -->
            <form action="." method="post">
                {% csrf_token %}
                <div class="card-body">
                    <div class="flex flex-col gap-2">
                        <p> آیا از حذف محصول زیر اطمینان دارید؟</p>
                        <div class="flex flex-col gap-2">
                            <span>شناسه محصول: {{object.pk}}</span>
                            <span>نام  محصول: {{object.product}}</span>
                        </div>

                    </div>
                    <div class="card-footer">
                        <div class="flex pt-6 justify-end">
                            <button type="submit" class="btn btn-danger">تایید حذف</button>
                            <a class="btn btn-secondary" href="{% url 'dashboard:admin:specification-edit' pk=object.pk %}">بازگشت</a>
                        </div>
                    </div>
            </form>
        </div>
    </div>

{% endblock %}
