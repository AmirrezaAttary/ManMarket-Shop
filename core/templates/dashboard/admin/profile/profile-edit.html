{% extends 'dashboard/admin/layout.html' %}

{% block content %}
<main>
    <div >
        <section class="user-panel">
            <div class="user-panel-content">
                        <h6 >
                            ویرایش پروفایل
                        </h6>
                        <form action="." method="post" class="mt-4">
                            {% csrf_token %}
                            <div class="grid grid-cols-12 gap-x-4 profile-input">
                                <div class="col-span-12 md:col-span-6 mb-4">
                                    <input type="text" name="first_name" value="{{request.user.user_profile.first_name}}" placeholder="نام">
                                </div>
                                <div class="col-span-12 md:col-span-6 mb-4">
                                    <input type="text" name="last_name" value="{{request.user.user_profile.last_name}}" placeholder="نام خانوادگی">
                                </div>
                                
                                <div class="col-span-12 md:col-span-6 mb-4">
                                    <input type="email" name="email" value="{{request.user.email}}" placeholder="ایمیل">
                                </div>

                                <div class="col-span-12 md:col-span-6 mb-4">
                                    <input type="text" name="phone_number" value="{{request.user.phone_number}}" placeholder="شماره همراه">
                                </div>

                                <div class="col-span-12 md:col-span-6 mb-4">
                                    <input type="text" name="code_melli" value="{{request.user.code_melli}}" placeholder="کد ملی">
                                </div>

                                <div class="col-span-12 text-start">
                                    <button class="btn bg-slate-50 theme-color rounded-1 text-slate-800">
                                        انصراف</button>
                                    <button class="btn theme-color rounded-1 text-light">
                                        ذخیره اطلاعات</button>
                                </div>
                            </div>
                        </form>
                        {% if request.user.is_authenticated and not request.user.is_verified %}
                                <form action="" method="post" id="resend-activation-form">
                                    {% csrf_token %}
                                    <input type="hidden" name="email" value="{{ request.user.email }}">
                                    <button type="submit" class="btn btn-warning">ارسال مجدد لینک تایید</button>
                        </form>
                        {% endif %}
                        <form action="{% url 'dashboard:admin:download_database' %}" method="get">
                            <button type="submit" class="btn btn-primary">📥 دانلود بک‌آپ دیتابیس</button>
                        </form>
                        <br>
                        <form action="{% url 'dashboard:admin:download_media' %}" method="get">
                            <button type="submit" class="btn btn-primary">📥 دانلود بک‌آپ فایل ها مدیا</button>
                        </form>
                    </div>
                </div>
            
        </section>
    
</main>
{% endblock content %}
