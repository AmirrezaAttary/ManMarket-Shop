{% extends 'dashboard/admin/layout.html' %}
{% load static %}
{% load humanize %}

{% block extra_css %}
<style>
    .small-primary-button {
        padding: 3px 10px;
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 10px;
        border-radius: 5px;
    }

    .small-primary-button:hover,
    .small-primary-button:focus {
        background-color: #0056b3;
    }
</style>
{% endblock %}

{% block content %}
<div>
            <div class="card mb-6">
                <!-- Header -->
                <div class="card-header flex justify-between items-center">
                    <h5 class="card-header-title">ویرایش برند </h5>
                </div>
                <!-- End Header -->

                <!-- Body -->
                <form action="." method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="card-body">
                        <div class="grid grid-cols-12 gap-x-4 flex">
                            <div class="col-span-12 md:col-span-6 mb-4">
                                <label>نام برند </label>
                                {{form.title}}
                            </div>
                            <div class="col-span-12 md:col-span-6 mb-4">
                                <label>slug برند - <button class="small-primary-button" type="button" onclick="generateSlug()">ساخت
                                        slug</button> </label>
                                {{form.slug}}
                            </div>

                            <div class="grid grid-cols-12 gap-x-4">
                                <div class="col-span-12 md:col-span-6 mb-4">
                                    <label>عکس برند</label>
                                    {{form.image}}
                                </div>
                            </div>

                        </div>
                        <div class="card-footer">
                            <div class="flex pt-6 justify-end">
                                <a class="btn btn-danger" href="{% url 'dashboard:admin:brand-delete' pk=object.pk %}">حذف</a>
                                <a class="btn btn-secondary" href="{% url 'dashboard:admin:brand-list' %}">بازگشت</a>
                                <button class="btn btn-primary" type="submit">ثبت تغییرات</button>
                            </div>
                        </div>
                </form>
            </div>
        </div>
    </div>

{% endblock %}

{% block extra_js %}
<script>

    function generateSlug() {
        const title = $("#id_title").val();
        const slug = slugify(title);
        $("#id_slug").val(slug)
    }

    function slugify(titleStr) {
        titleStr = titleStr.replace(/^\s+|\s+$/g, '');
        titleStr = titleStr.toLowerCase();
        //persian support
        titleStr = titleStr.replace(/[^a-z0-9_\s-ءاأإآؤئبتثجحخدذرزسشصضطظعغفقكلمنهويةى]#u/, '')
            // Collapse whitespace and replace by -
            .replace(/\s+/g, '-')
            // Collapse dashes
            .replace(/-+/g, '-');
        slugStr = titleStr;
        return slugStr;
    }
</script>
{% endblock %}
