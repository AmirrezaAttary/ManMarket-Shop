{% extends 'base.html' %}
{% load static %}
{% load humanize %}

{% block extra_css %}
<style>
    .small-primary-button {
        padding: 3px 10px;
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 10px;
        border-radius: 5px;
    }

    .small-primary-button:hover,
    .small-primary-button:focus {
        background-color: #0056b3;
    }
</style>
{% endblock %}


{% block content %}
<br><br><br><br>
<div class="row">
    {% include 'dashboard/admin/sidebar.html' %}
    <div class="col-md-9">
        <div>
            <div class="card mb-5">
                <!-- Header -->
                <div class="card-header border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="card-header-title">ویرایش محصول ثبت شده </h5>

                </div>
                <!-- End Header -->

                <!-- Body -->
                <form action="." method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="card-body">
                        <div class="row d-flex ">
                            <div style="margin-top: 28px;" class="col-md-6 mb-3">
                                <label>نام محصول </label>
                                {{form.product}}
                            </div>
                            <div style="margin-top: 28px;" class="col-md-6 mb-3">
                                <label>آدرس محصول همراه تل</label>
                                {{form.url}}
                            </div>
                            <div style="margin-top: 28px;" class="col-md-6 mb-3">
                                <label>آدرس محصول کسرا پلاس </label>
                                {{form.url_kasra}}
                            </div>
                        <div style="margin-top: 28px;" class="col-md-6 mb-3">
                            <label>درصد سود</label>
                            {{form.profit}}
                        </div>



                        </div>
                        <div class="card-footer">
                            <div class=" d-flex pt-5 justify-content-end">
                                <a class="btn btn-danger ms-3"
                                    href="{% url 'dashboard:admin:colors-delete' pk=object.pk %}">حذف</a>
                                <a class="btn btn-secondary ms-3"
                                    href="{% url 'dashboard:admin:colors-list' %}">بازگشت</a>
                                <button class="btn btn-primary ms-3" type="submit">ثبت تغییرات</button>
                            </div>
                        </div>
                </form>
            </div>
        </div>
    </div>

</div>

{% endblock %}
