{% extends 'dashboard/admin/layout.html' %}
{% load static %}

{% block content %}
<!-- Card -->
<!-- Card -->
        <div class="card mb-4">
            <div class="card-header">
                <h4 class="card-header-title">ویرایش محصول ثبت شده </h4>
            </div>
            <form method="get" action=".">
                <label for="brand-select">فیلتر بر اساس برند:</label>
                <select id="brand-select" name="brand" onchange="this.form.submit()" >
                    <option value="">همه برندها</option>
                    {% for brand in brands %}
                        <option value="{{ brand.slug }}" {% if brand.slug == selected_brand %}selected{% endif %}>{{ brand.title }}</option>
                    {% endfor %}
                </select>
                <select id="category-select" name="category" onchange="this.form.submit()" >
                    <option value="">همه دسته‌بندی‌ها</option>
                    {% for category in categorys %}
                        <option value="{{ category.slug }}" {% if category.slug == selected_category %}selected{% endif %}>{{ category.title }}</option>
                    {% endfor %}
                </select>
                <input type="text" name="q" placeholder="جستجو... کد محصول یا نام" value="{{ request.GET.q }}">
            </form>

            <form action="." method="post">
                <!-- Body -->
                <div class="card-body">
                    <!-- Form -->

                    {% csrf_token %}

                    <!-- Form -->
                    <div class="grid grid-cols-12 gap-x-4">
                        <div class="col-span-12 md:col-span-6 mb-4">
                            <label>نام محصول </label>
                            {{form.product}}
                        </div>
                        <div class="col-span-12 md:col-span-6 mb-4">
                            <label>آدرس محصول همراه تل</label>
                            {{form.url}}
                        </div>
                        <div class="col-span-12 md:col-span-6 mb-4">
                            <label>آدرس محصول کسرا پلاس </label>
                            {{form.url_kasra}}
                        </div>
                        <div class="col-span-12 md:col-span-6 mb-4">
                            <label>درصد سود</label>
                            {{form.profit}}
                        </div>

                        <!-- End Body -->

                        <!-- Footer -->
                        <div class="card-footer pt-0">
                            <div class="flex justify-end gap-3">
                                <a class="btn btn-secondary" href="{% url 'dashboard:admin:colors-list' %}">بازگشت</a>
                                <button class="btn btn-primary" type="submit">ذخیره تغییرات</button>
                            </div>
                        </div>
            </form>
            <!-- End Footer -->
        </div>
        <!-- End Card -->
    </div>
</div>

{% endblock %}
