{% extends 'dashboard/admin/layout.html' %}
{% load static %}

{% block content %}
<h2>حذف پیام</h2>
        <p>آیا مطمئن هستید که می‌خواهید پیام "{{ object.name }}" را حذف کنید؟</p>

        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">بله، حذف کن</button>
            <a href="{% url 'dashboard:admin:contact-list' %}" class="btn btn-secondary">انصراف</a>
        </form>

    

{% endblock content %}
