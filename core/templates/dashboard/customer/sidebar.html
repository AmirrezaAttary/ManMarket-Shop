{% load static %}

<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="icon-alert-triangle-fill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
    </symbol>
    <symbol id="icon-arrow-down-circle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.5">
        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="m7 6l5 5l5-5M7 13l5 5l5-5"></path>
    </symbol>
    <symbol id="icon-arrow-up-circle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.5">
        <path fill="currentColor" d="M6 17.59L7.41 19L12 14.42L16.59 19L18 17.59l-6-6z"></path>
        <path fill="currentColor" d="m6 11l1.41 1.41L12 7.83l4.59 4.58L18 11l-6-6z"></path>
    </symbol>
    <symbol id="icon-cancel-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
    </symbol>
    <symbol id="icon-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path
            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
        </path>
        <circle cx="12" cy="11.5" r="1"></circle>
        <circle cx="16" cy="11.5" r="1"></circle>
        <circle cx="8" cy="11.5" r="1"></circle>
    </symbol>
    <symbol id="icon-check-circle-fill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
    </symbol>
    <symbol id="icon-comment-dots" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </symbol>
    <symbol id="icon-edit-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
    </symbol>
    <symbol id="icon-external-link" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.8">
        <g fill="none" stroke="currentColor">
            <path d="M21 12c0 1.2-4.03 6-9 6s-9-4.8-9-6s4.03-6 9-6s9 4.8 9 6Z"></path>
            <path d="M15 12a3 3 0 1 1-6 0a3 3 0 0 1 6 0Z"></path>
        </g>
    </symbol>
    <symbol id="icon-heart-solid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
        </path>
    </symbol>
    <symbol id="icon-info-circle-fill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
    </symbol>
    <symbol id="icon-lock-password" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </symbol>
    <symbol id="icon-logout-door" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
    </symbol>
    <symbol id="icon-map-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
    </symbol>
    <symbol id="icon-plus-circle-fill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="16"></line>
        <line x1="8" y1="12" x2="16" y2="12"></line>
    </symbol>
    <symbol id="icon-receipt-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
    </symbol>
    <symbol id="icon-save-disk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
    </symbol>
    <symbol id="icon-trash-can" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    </symbol>
    <symbol id="icon-user-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
    </symbol>
    <symbol id="icon-wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path
            d="M21 12.7v5.8a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 18.5v-13A1.5 1.5 0 0 1 4.5 4H18a1.5 1.5 0 0 1 1.5 1.5V9">
        </path>
        <path d="M21 7.5H3"></path>
        <path d="M18 12.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path>
    </symbol>
    <symbol id="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.8">
        <g fill="none" stroke="currentColor">
            <path d="M21 12c0 1.2-4.03 6-9 6s-9-4.8-9-6s4.03-6 9-6s9 4.8 9 6Z"></path>
            <path d="M15 12a3 3 0 1 1-6 0a3 3 0 0 1 6 0Z"></path>
        </g>
    </symbol>
    <symbol id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="1em" height="1em">
        <path fill="currentColor"
            d="M5.22 12.549c.856.29 1.783.451 2.78.451c3.462 0 6.094-1.955 7.826-4.433a1.01 101 0 0 0 0-1.134c-.74-1.06-1.646-2.024-2.71-2.78l-.725.724c1.029.7 1.901 1.618 2.604 2.632C13.438 10.234 11.06 12 8 12a7.6 7.6 0 0 1-1.975-.257zm1.735-1.736a3 3 0 0 0 3.858-3.858l-.825.825A2 2 0 0 1 7.78 9.988zM6.012 8.22l-.825.825a3 3 0 0 1 3.858-3.858l-.825.825A2 2 0 0 0 6.012 8.22m3.963-3.963A7.6 7.6 0 0 0 8 4C4.938 4 2.558 5.769 1.007 7.987c.702 1.016 1.574 1.935 2.603 2.636l-.726.725C1.82 10.59.914 9.628.173 8.568a1.02 102 0 0 1 .006-1.145C1.905 4.955 4.537 3 8 3a8.6 8.6 0 0 1 2.782.452zM1.854 14.854a.5.5 0 0 1-.708-.708l13-13a.5.5 0 0 1 .708.708z">
        </path>
    </symbol>
</svg>

<div class="main-container mt-5 py-5">
    <div class="profile-layout-grid">
        <aside class="profile-sidebar-new">
            <form method="post" id="profileImageForm" action="{% url 'dashboard:customer:profile-image-edit' %}"
                enctype="multipart/form-data">
                {% csrf_token %}
                <div class="sidebar-user-info">
                    <div class="sidebar-avatar-wrapper">
                        <img src="{{ request.user.user_profile.image.url }}" alt="آواتار پیش‌فرض" class="sidebar-avatar"
                            id="profileAvatarPreview">
                        <label for="avatarUploadInput" class="sidebar-avatar-upload p-1" title="تغییر عکس پروفایل">
                            <svg viewBox="0 0 24 24">
                                <use xlink:href="#icon-edit-pencil"></use>
                            </svg>
                        </label>
                        <input type="file" name="image" id="avatarUploadInput" class="d-none" accept="image/*"
                            onchange="setTimeout(() => document.getElementById('profileImageForm').submit(), 100);">
                    </div>
                </div>
            </form>

            <h1 class="sidebar-user-name text-dark">{{request.user.user_profile.get_full_name}}</h1>

            <nav class="sidebar-nav-new">
                <ul>
                    <li><a href="{% url 'dashboard:customer:profile-edit' %}" data-page="account"
                            class="{% if request.resolver_match.view_name == 'dashboard:customer:profile-edit' %}active {% endif %}"><svg>
                                <use xlink:href="#icon-user-circle"></use>
                            </svg> اطلاعات حساب</a></li>
                    <li><a href="{% url 'dashboard:customer:order-list' %}"
                            class="{% if request.resolver_match.view_name == 'dashboard:customer:order-list' %}active {% endif %}"
                            data-page="orders"><svg>
                                <use xlink:href="#icon-receipt-list"></use>
                            </svg> سفارشات</a></li>
                    <li><a href="{% url 'dashboard:customer:wallet-detail' %}" data-page="wallet"
                            class="{% if request.resolver_match.view_name == 'dashboard:customer:wallet-detail' %}active {% endif %}"><svg>
                                <use xlink:href="#icon-wallet"></use>
                            </svg> کیف پول</a></li>
                    <li><a href="{% url 'dashboard:customer:address-list' %}"
                            class="{% if request.resolver_match.view_name == 'dashboard:customer:address-list' %}active {% endif %}"
                            data-page="addresses"><svg>
                                <use xlink:href="#icon-map-pin"></use>
                            </svg> آدرس‌ها</a></li>
                    <li><a href="{% url 'dashboard:customer:wishlist-list' %}"
                            class="{% if request.resolver_match.view_name == 'dashboard:customer:wishlist-list' %}active {% endif %}"><svg>
                                <use xlink:href="#icon-heart-solid"></use>
                            </svg> علاقه‌مندی‌ها</a></li>
                    <!-- <li><a href="#" data-page="reviews"><svg>
                                <use xlink:href="#icon-comment-dots"></use>
                            </svg> نظرات من</a></li> -->
                    <li><a href="{% url 'dashboard:customer:security-edit' %}"
                            class="{% if request.resolver_match.view_name == 'dashboard:customer:security-edit' %}active {% endif %}"
                            data-page="password"><svg>
                                <use xlink:href="#icon-lock-password"></use>
                            </svg> تغییر رمز</a></li>
                    <li class="nav-separator"></li>
                    <li><a href="{% url 'accounts:logout' %}"><svg>
                                <use xlink:href="#icon-logout-door"></use>
                            </svg> خروج از حساب</a></li>
                </ul>
            </nav>
        </aside>
