{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>تایید موبایل</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/toastify/toastify.css' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/logo/logo_header3.png' %}">
</head>

<body>
  <div class="px-1 py-1"
    style="height: 100vh ; width: 100%;display: flex; justify-content: center;align-items: center;">
    <div class="ki-ta-form-container">
      <!-- فرم تایید OTP -->
      <form id="ki-ta-verification-form" method="post" action=".">
        {% csrf_token %}
        <div class="ki-ta-effect-box">
          <div class="ki-ta-icon-container">
            <svg class="ki-ta-check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
              <circle class="ki-ta-circle" cx="26" cy="26" r="25" fill="none" />
              <path class="ki-ta-check-path" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
            </svg>
          </div>
          <h2 class="ki-ta-title my-4">کد تایید را وارد کنید</h2>

          <input type="hidden" name="phone_number" id="user-id" value="{{form.phone_number.value}}">
          <div class="ki-ta-pin-input-container mt-3">
            <input name="code" type="tel" maxlength="1" class="ki-ta-pin-input rounded-3" autofocus>
            <input type="tel" maxlength="1" class="ki-ta-pin-input rounded-3">
            <input type="tel" maxlength="1" class="ki-ta-pin-input rounded-3">
            <input type="tel" maxlength="1" class="ki-ta-pin-input rounded-3">
            <input type="tel" maxlength="1" class="ki-ta-pin-input rounded-3">
          </div>
          <input type="hidden" name="code" id="hidden-code">
        </div>
        <button type="submit" class="ki-ta-submit-btn fs-14">تایید</button>
      </form>

      <!-- تایمر + ارسال دوباره -->
      <div id="timer" class="mt-3 text-center fs-14"></div>
      <button type="button" id="resend-btn" class="btn btn-secondary mt-2" style="display:none;">
        ارسال دوباره کد
      </button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const pinInputs = document.querySelectorAll('.ki-ta-pin-input');
      const hiddenCodeInput = document.getElementById('hidden-code');
      const form = document.getElementById('ki-ta-verification-form');
      const timerDisplay = document.getElementById('timer');
      const resendBtn = document.getElementById('resend-btn');
      const userId = document.getElementById('user-id').value;

      let timeLeft = 120; // 2 دقیقه

      function updateTimer() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerDisplay.textContent = `ارسال مجدد کد تا ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerDisplay.textContent = "زمان کد به پایان رسید.";
          resendBtn.style.display = 'inline-block';
        }
        timeLeft--;
      }

      let timerInterval = setInterval(updateTimer, 1000);
      updateTimer();

      // دکمه ارسال دوباره
      resendBtn.addEventListener('click', () => {
        resendBtn.disabled = true;
        fetch("{% url 'accounts:phone_otp_resend' %}", {
          method: "POST",
          headers: {
            "X-CSRFToken": "{{ csrf_token }}",
            "X-Requested-With": "XMLHttpRequest",   // 👈 اینو اضافه کن
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            user_id: userId
          })
        })
          .then(res => res.json())
          .then(data => {
            if (data.status === 'ok') {
              Toastify({ text: data.message, backgroundColor: "green", duration: 3000 }).showToast();
              timeLeft = 120;
              resendBtn.style.display = 'none';
              resendBtn.disabled = false;
              timerInterval = setInterval(updateTimer, 1000);
            } else {
              Toastify({ text: data.message, backgroundColor: "red", duration: 3000 }).showToast();
              resendBtn.disabled = false;
            }
          })
          .catch(err => {
            console.error("خطا در ارسال:", err);
            Toastify({ text: "خطا در ارتباط با سرور", backgroundColor: "red", duration: 3000 }).showToast();
            resendBtn.disabled = false;
          });
      });

      // اتصال فیلدهای پین به hidden input
      pinInputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          const value = e.target.value.replace(/[^0-9]/g, '');
          e.target.value = value;
          if (value.length === 1 && index < pinInputs.length - 1) {
            pinInputs[index + 1].focus();
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
            pinInputs[index - 1].focus();
          }
        });
      });

      // قبل از ارسال فرم، کد کامل رو داخل hidden input می‌ریزیم
      form.addEventListener('submit', () => {
        let code = '';
        pinInputs.forEach(input => {
          code += input.value;
        });
        hiddenCodeInput.value = code;
      });
    });
  </script>

  <script src="{% static 'vendor/toastify/toastify.js' %}"></script>
  {% include 'messages.html' %}
</body>

</html>
