{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ورود به من مارکت</title>
    <meta name="description" content="ورود سریع و امن به حساب کاربری من‌مارکت برای مدیریت سفارش‌ها و استفاده از تخفیف‌های اختصاصی.">

    <link rel="stylesheet" href="{% static 'css/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/logo/logo_header3.png' %}">
    <link rel="stylesheet" href="{% static 'vendor/toastify/toastify.css' %}">

    <style>
        div span svg {
            margin-bottom: 33px;
        }
    </style>
</head>
<body class="body-f">

<div class="logix-auth-card py-5">
    <a class="mx-2 back-to d-inline position-absolute top-0 mt-2" href="{% url 'website:index' %}" style="right: 10px">
        <svg style="font-weight: bold !important;" class="cs-svg theme-c" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="39px" height="39px">
            <path fill="currentColor" fill-rule="evenodd" d="M2 10a.75.75 0 0 1 .75-.75h12.59l-2.1-1.95a.75.75 0 1 1 1.02-1.1l3.5 3.25a.75.75 0 0 1 0 1.1l-3.5 3.25a.75.75 0 1 1-1.02-1.1l2.1-1.95H2.75A.75.75 0 0 1 2 10" clip-rule="evenodd"></path>
        </svg>
    </a>

    <div class="logix-auth-header d-flex justify-content-center w-center">
        <img src="{% static 'img/main.logo2.png' %}" alt="لوگو سایت شما" class="logix-logo">
    </div>

    <form action="{% url 'accounts:login' %}" method="post" id="loginForm">
        {% csrf_token %}
        <div class="mb-3 ">
            <label for="email" class="form-label">شماره همراه</label>
            <input name="username" type="number" class="form-control" id="email" required>
            <div class="invalid-feedback d-none" id="email-error"> شماره همراه  شما معتبر نیست</div>
        </div>

        <div class="logix-password-input-group mb-4">
            <label for="password" class="form-label">رمز عبور</label>
            <input name="password" type="password" class="form-control logix-password-field" id="password" required>
            <span class="logix-toggle-password" data-target="password">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="1em" height="1em">
                    <g fill="none" stroke="currentColor">
                        <circle cx="8" cy="8" r="2.5"></circle>
                        <path stroke-linecap="round" d="M15.42 8.29c.12-.18.12-.4 0-.58c-.7-1-3.28-4.21-7.42-4.21S1.28 6.71.58 7.71c-.12.18-.12.4 0 .58c.7 1 3.28 4.21 7.42 4.21s6.72-3.21 7.42-4.21z"></path>
                    </g>
                </svg>
            </span>
            <div class="d-flex justify-content-end mt-2 flex-column">
                <a href="{% url 'accounts:otp_request' %}" class="text-link mt-2" style="font-size: 12px;">ورود با کد یکبار مصرف</a>
                <a href="{% url 'accounts:password_reset' %}" class="text-link mt-2" style="font-size: 12px;">رمز عبور خود را فراموش کرده‌اید؟</a>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 fs-14">ورود</button>
    </form>

    <div class="logix-divider">یا</div>



    <div class="form-text mt-3">
        حساب کاربری ندارید؟ <a href="{% url 'accounts:register' %}" class="text-link fs-14">ثبت نام</a>
    </div>
</div>


<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'js/more.js' %}"></script>
<script src="{% static 'vendor/toastify/toastify.js' %}"></script>
{% include 'messages.html' %}
</body>
</html>
