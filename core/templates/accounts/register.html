{% load static %}
{% load socialaccount %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام در من‌مارکت | تخفیف‌ها و امکانات ویژه</title>
    <meta name="description" content="با عضویت رایگان در من‌مارکت، به جدیدترین محصولات دیجیتال، تخفیف‌های ویژه و خدمات اختصاصی دسترسی پیدا کنید. ثبت‌نام آسان و سریع." />
    
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/logo/logo.webp' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="body-f">

    <div class="sing-auth-card">

        <!-- دکمه بازگشت -->
        <a class="mx-2 back-to d-inline position-absolute top-0 mt-2" href="{{ request.META.HTTP_REFERER }}" style="right: 10px" aria-label="بازگشت به صفحه قبلی">
            <svg class="cs-svg theme-c" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="35" height="35">
                <path fill="currentColor" fill-rule="evenodd"
                    d="M2 10a.75.75 0 0 1 .75-.75h12.59l-2.1-1.95a.75.75 0 1 1 1.02-1.1l3.5 3.25a.75.75 0 0 1 0 1.1l-3.5 3.25a.75.75 0 1 1-1.02-1.1l2.1-1.95H2.75A.75.75 0 0 1 2 10"
                    clip-rule="evenodd"></path>
            </svg>
        </a>

        <!-- لوگو -->
        <div class="sing-auth-header d-flex justify-content-center w-center">
            <img src="{% static 'img/main.logo.jpg' %}" alt="لوگوی من‌مارکت" class="sing-logo">
        </div>

        <!-- فرم ثبت‌نام -->
        <form method="post" action=".">
            {% csrf_token %}
            
            <!-- ایمیل -->
            <div class="mb-3">
                <label for="email" class="form-label">ایمیل</label>
                <input type="text" name="email_or_phone" class="form-control" id="email"
                       placeholder="مثال: yourname@example.com" required>
                <div class="invalid-feedback d-none" id="email-error">لطفاً یک ایمیل معتبر وارد کنید.</div>
            </div>

            <!-- رمز عبور -->
            <div class="mb-3">
                <label for="password" class="form-label">رمز عبور</label>
                <div class="sing-password-field-container">
                    <input type="password" name="password1" class="form-control sing-password-field" id="password"
                           placeholder="حداقل ۸ کاراکتر" required minlength="8">
                    <span class="sing-toggle-password" data-target="password" aria-label="نمایش رمز">
                        <!-- آیکون چشم -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="1em" height="1em">
                            <g fill="none" stroke="currentColor">
                                <circle cx="8" cy="8" r="2.5"></circle>
                                <path stroke-linecap="round"
                                      d="M15.42 8.29c.12-.18.12-.4 0-.58C14.72 6.71 12.14 3.5 8 3.5S1.28 6.71.58 7.71c-.12.18-.12.4 0 .58C1.28 9.29 3.86 12.5 8 12.5s6.72-3.21 7.42-4.21z">
                                </path>
                            </g>
                        </svg>
                    </span>
                </div>
            </div>

            <!-- تکرار رمز عبور -->
            <div class="mb-4">
                <label for="confirm-password" class="form-label">تکرار رمز عبور</label>
                <div class="sing-password-field-container">
                    <input type="password" name="password2" class="form-control sing-password-field" id="confirm-password"
                           placeholder="رمز عبور را مجدداً وارد کنید" required>
                    <span class="sing-toggle-password" data-target="confirm-password" aria-label="نمایش رمز">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="1em" height="1em">
                            <g fill="none" stroke="currentColor">
                                <circle cx="8" cy="8" r="2.5"></circle>
                                <path stroke-linecap="round"
                                      d="M15.42 8.29c.12-.18.12-.4 0-.58C14.72 6.71 12.14 3.5 8 3.5S1.28 6.71.58 7.71c-.12.18-.12.4 0 .58C1.28 9.29 3.86 12.5 8 12.5s6.72-3.21 7.42-4.21z">
                                </path>
                            </g>
                        </svg>
                    </span>
                </div>
                <div class="invalid-feedback d-none" id="confirm-password-error">رمزهای عبور یکسان نیستند.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100">ثبت‌نام</button>
        </form>

        <!-- جداکننده -->
        <div class="sing-divider">یا</div>

        <!-- دکمه ثبت‌نام با گوگل -->
        <form action="{% provider_login_url 'google' %}" method="post" id="google">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-secondary w-100" aria-label="ثبت نام با گوگل">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="me-2">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.5-.18-2.22H12v4.46h6.41c-.29 1.45-1.12 2.68-2.34 3.47v2.92h3.76c2.2-2.03 3.48-4.97 3.48-8.63z"/>
                    <path fill="#34A853" d="M12 23c3.04 0 5.58-1 7.44-2.73l-3.76-2.92c-1.09.73-2.52 1.15-4.06 1.15-3.13 0-5.78-2.11-6.73-4.93H1.47v2.99C3.44 20.38 7.33 23 12 23z"/>
                    <path fill="#FBBC05" d="M4.27 14.34c-.21-.65-.33-1.34-.33-2.06s.12-1.41.33-2.06V7.29H.51C.19 8.04 0 8.97 0 10c0 1.03.19 1.96.51 2.71l3.76 4.34z"/>
                    <path fill="#EA4335" d="M12 4.19c1.78 0 3.29.62 4.5 1.77l3.35-3.35C17.58 1.48 15.04 0 12 0 7.37 0 3.48 2.66 1.47 6.55l3.76 2.99C6.22 6.3 8.87 4.19 12 4.19z"/>
                </svg>
                ثبت‌نام با گوگل
            </button>
        </form>

        <!-- لینک ورود -->
        <div class="form-text mt-3 text-center">
            قبلاً حساب دارید؟ <a href="{% url 'accounts:login' %}">وارد شوید</a>
        </div>

    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/more.js' %}"></script>

</body>
</html>
