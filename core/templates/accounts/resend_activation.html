{% extends "base.html" %}

{% block content %}
<br><br><br><br>
<div class="container" style="margin-top: 50px;">
    <h3>ارسال مجدد لینک فعال‌سازی</h3>

    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li style="color: {% if message.tags == 'success' %}green{% elif message.tags == 'error' %}red{% else %}black{% endif %};">
            {{ message }}
          </li>
        {% endfor %}
      </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <input type="text" name="email" placeholder="ایمیل خود را وارد کنید" class="form-control mb-3" value="{{request.user.email}}" required>
        <button type="submit" class="btn btn-primary">ارسال لینک فعال‌سازی</button>
    </form>
</div>
{% endblock %}
