{% load static %}


<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ورود به من مارکت</title>
    <meta name="description" content="ورود سریع و امن به حساب کاربری من‌مارکت برای مدیریت سفارش‌ها و استفاده از تخفیف‌های اختصاصی.">

    <link rel="stylesheet" href="{% static 'css/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/logo/logo_header3.png' %}">
    <link rel="stylesheet" href="{% static 'vendor/toastify/toastify.css' %}">

    <style>
        div span svg {
            margin-bottom: 33px;
        }
    </style>
</head>
<body class="body-f">

<div class="logix-auth-card py-5">
    <a class="mx-2 back-to d-inline position-absolute top-0 mt-2" href="{% url 'accounts:login' %}" style="right: 10px">
        <svg style="font-weight: bold !important;" class="cs-svg theme-c" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="39px" height="39px">
            <path fill="currentColor" fill-rule="evenodd" d="M2 10a.75.75 0 0 1 .75-.75h12.59l-2.1-1.95a.75.75 0 1 1 1.02-1.1l3.5 3.25a.75.75 0 0 1 0 1.1l-3.5 3.25a.75.75 0 1 1-1.02-1.1l2.1-1.95H2.75A.75.75 0 0 1 2 10" clip-rule="evenodd"></path>
        </svg>
    </a>

    <div class="logix-auth-header d-flex justify-content-center w-center">
        <img src="{% static 'img/main.logo2.png' %}" alt="لوگو سایت شما" class="logix-logo">
    </div>

    <form action="." method="post" id="loginForm">
        {% csrf_token %}
        <div class="mb-3 ">
            <label for="phone_number" class="form-label">شماره همراه</label>
            <input name="phone_number" type="number" class="form-control" id="phone_number" required>
            <div class="invalid-feedback d-none" id="email-error"> شماره همراه  شما معتبر نیست</div>
        </div>

        <div class="logix-password-input-group mb-4">
            <div class="d-flex justify-content-end mt-2 flex-column">
                <a href="{% url 'accounts:login' %}" class="text-link mt-2" style="font-size: 12px;">ورود با رمز عبور</a>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 fs-14">ارسال کد یکبار مصرف</button>
    </form>

    <div class="logix-divider">یا</div>

    <div class="form-text mt-3">
        حساب کاربری ندارید؟ <a href="{% url 'accounts:register' %}" class="text-link fs-14">ثبت نام</a>
    </div>
</div>

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'js/more.js' %}"></script>
<script src="{% static 'vendor/toastify/toastify.js' %}"></script>
{% include 'messages.html' %}
</body>
</html>
