{% load static %}
{% load socialaccount %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>بازیابی رمز در من‌مارکت | تخفیف‌ها و امکانات ویژه</title>
    <meta name="description"
        content="با عضویت رایگان در من‌مارکت، به جدیدترین محصولات دیجیتال، تخفیف‌های ویژه و خدمات اختصاصی دسترسی پیدا کنید. بازیابی رمز آسان و سریع." />

    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/logo/logo_header3.png' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/logo/logo_header3.png' %}">
    <link rel="stylesheet" href="{% static 'vendor/toastify/toastify.css' %}">
</head>

<body class="body-f">

    <div class="sing-auth-card">

        <!-- دکمه بازگشت -->
        <a class="mx-2 back-to d-inline position-absolute top-0 mt-2" href="{% url 'accounts:login' %}"
            style="right: 10px" aria-label="بازگشت به صفحه قبلی">
            <svg class="cs-svg theme-c" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="35" height="35">
                <path fill="currentColor" fill-rule="evenodd"
                    d="M2 10a.75.75 0 0 1 .75-.75h12.59l-2.1-1.95a.75.75 0 1 1 1.02-1.1l3.5 3.25a.75.75 0 0 1 0 1.1l-3.5 3.25a.75.75 0 1 1-1.02-1.1l2.1-1.95H2.75A.75.75 0 0 1 2 10"
                    clip-rule="evenodd"></path>
            </svg>
        </a>

        <!-- لوگو -->
        <div class="sing-auth-header d-flex justify-content-center w-center">
            <img src="{% static 'img/main.logo2.png' %}" alt="لوگوی من‌مارکت" class="sing-logo">
        </div>

        <!-- فرم بازیابی رمز -->
        <form method="post" action=".">
            {% csrf_token %}

            <!-- شماره تلفن -->

            <!-- رمز عبور -->
            <div class="mb-3">
                <label for="password" class="form-label">رمز عبور</label>
                <div class="sing-password-field-container">
                    <input type="password" name="new_password" class="form-control sing-password-field" id="password"
                        placeholder="حداقل ۸ کاراکتر" required minlength="8">
                    <span class="sing-toggle-password" data-target="password" aria-label="نمایش رمز">
                        <!-- آیکون چشم -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="1em" height="1em">
                            <g fill="none" stroke="currentColor">
                                <circle cx="8" cy="8" r="2.5"></circle>
                                <path stroke-linecap="round"
                                    d="M15.42 8.29c.12-.18.12-.4 0-.58C14.72 6.71 12.14 3.5 8 3.5S1.28 6.71.58 7.71c-.12.18-.12.4 0 .58C1.28 9.29 3.86 12.5 8 12.5s6.72-3.21 7.42-4.21z">
                                </path>
                            </g>
                        </svg>
                    </span>
                </div>
            </div>

            <!-- تکرار رمز عبور -->
            <div class="mb-4">
                <label for="confirm-password" class="form-label">تکرار رمز عبور</label>
                <div class="sing-password-field-container">
                    <input type="password" name="confirm_password" class="form-control sing-password-field"
                        id="confirm-password" placeholder="رمز عبور را مجدداً وارد کنید" required>
                    <span class="sing-toggle-password" data-target="confirm-password" aria-label="نمایش رمز">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="1em" height="1em">
                            <g fill="none" stroke="currentColor">
                                <circle cx="8" cy="8" r="2.5"></circle>
                                <path stroke-linecap="round"
                                    d="M15.42 8.29c.12-.18.12-.4 0-.58C14.72 6.71 12.14 3.5 8 3.5S1.28 6.71.58 7.71c-.12.18-.12.4 0 .58C1.28 9.29 3.86 12.5 8 12.5s6.72-3.21 7.42-4.21z">
                                </path>
                            </g>
                        </svg>
                    </span>
                </div>
                <div class="invalid-feedback d-none" id="confirm-password-error">رمزهای عبور یکسان نیستند.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100">ثبت‌رمز</button>
        </form>

    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/more.js' %}"></script>
    <script src="{% static 'vendor/toastify/toastify.js' %}"></script>
    {% include 'messages.html' %}
</body>

</html>
