{% extends 'base.html' %}
{% load static %}

{% block title %}
    login
{% endblock title %}
    

{% block content %}
    

    



<main class="login d-flex justify-content-center align-items-center">


<!------------    login form :::::: start--------->
<form action="." method="post" class="px-2 py-3 d-flex justify-content-center flex-column align-items-center my-5">
    <!--    title in login box start-->
    {% csrf_token %}
        <div>
            <h5 class="text-center my-3">
                <span style="color: red;letter-spacing: -4px;font-size: 20px">------</span>
                <span class="px-2">بازیابی رمز</span>
                <span style="color: red;letter-spacing: -4px;font-size: 20px">------</span>
            </h5>
        </div>
    <!--    title in login box end---->

    <!--caption in login form start-->
        <div class="my-2">
            <p class="custom-text">
                
            </p>
        </div>
    <!--caption in login form end---->

        <!--name input start-------->
        
        <label class="w-100 px-3 my-1">
            رمز جدید
            <input type="text" name="new_password1" class="form-control custom-text my-3 py-2" placeholder="رمز جدید را وارد کنید">
            
        </label>
        <label class="w-100 px-3 my-1">
            تکرار رمز جدید
            <input type="text" name="new_password2" class="form-control custom-text my-3 py-2" placeholder="تکرار رمز جدید را وارد کنید">
            
        </label>
        <!--name input end---------->


    <!--more in login form start----->
        <button type="submit" class="theme-color px-5" style="border-radius: 20px;color: white;">
            ثبت رمز
        </button>

    <!--more in login form end------->

</form>
<!------------    login form :::::: end----------->

</main>

{% endblock content %}
