<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="background-color: #fff;">
    <select id="province-select">
        <option value="">انتخاب استان</option>
    </select>

    <select id="city-select">
        <option value="">ابتدا استان را انتخاب کنید</option>
    </select>

    <script>
        const provinceSelect = document.getElementById("province-select");
        const citySelect = document.getElementById("city-select");

        // دریافت لیست استان‌ها
        fetch('https://www.iran-locations-api.ir/api/v1/fa/states')
            .then(res => res.json())
            .then(data => {
                data.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.name;
                    opt.textContent = p.name;
                    provinceSelect.appendChild(opt);
                });
            });

        provinceSelect.addEventListener('change', function () {
            const prov = this.value;
            citySelect.innerHTML = '<option>در حال بارگذاری...</option>';
            fetch(`https://iran-locations-api.ir/api/v1/fa/cities?state_id=${encodeURIComponent(prov)}`)
                .then(res => res.json())
                .then(obj => {
                    citySelect.innerHTML = '<option value="">انتخاب شهر</option>';
                    (obj.cities || []).forEach(c => {
                        const o = document.createElement('option');
                        o.value = c.name;
                        o.textContent = c.name;
                        citySelect.appendChild(o);
                    });
                })
                .catch(err => {
                    citySelect.innerHTML = '<option>خطا در دریافت اطلاعات</option>';
                    console.error(err);
                });
        });
    </script>

</body>

</html>
