<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>تست انتخاب رنگ</title>
  <style>
    .active-cs {
      border: 2px solid red;
    }
  </style>
</head>
<body>

<!-- نمایش قیمت -->
<div>قیمت: <span id="price-value">0</span> تومان</div>

<!-- دکمه‌های انتخاب رنگ -->
<div class="color-selection-buttons">
  <button class="btn-color color-option active-cs"
    data-price="120000"
    data-color-id="1"
    data-color-inventory-id="11"
    data-color-value="قرمز">قرمز</button>

  <button class="btn-color color-option"
    data-price="130000"
    data-color-id="2"
    data-color-inventory-id="12"
    data-color-value="آبی">آبی</button>

  <button class="btn-color color-option"
    data-price="140000"
    data-color-id="3"
    data-color-inventory-id="13"
    data-color-value="سبز">سبز</button>
</div>

<!-- دکمه افزودن به سبد خرید -->
<div class="panel-action">
  <button id="add-to-cart-btn" style="font-size: 16px;">افزودن به سبد خرید</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const colorButtons = document.querySelectorAll('.color-option');
  const priceValueEl = document.getElementById('price-value');
  const addToCartBtn = document.getElementById('add-to-cart-btn');
  const OBJECT_ID = '123'; // مقدار تستی

  colorButtons.forEach(button => {
    button.addEventListener('click', function () {
      if (button.classList.contains('active-cs')) return;

      // حذف active از همه
      colorButtons.forEach(btn => btn.classList.remove('active-cs'));
      // فعال کردن دکمه کلیک‌شده
      button.classList.add('active-cs');

      // گرفتن داده‌ها
      const price = button.dataset.price;
      const colorId = button.dataset.colorId;
      const inventoryId = button.dataset.colorInventoryId;

      // آپدیت قیمت
      priceValueEl.textContent = price;

      // آپدیت دکمه سبد خرید
      addToCartBtn.setAttribute('onclick', `addToCart('${OBJECT_ID}', '${colorId}', '${inventoryId}')`);
    });
  });
});

// فقط برای تست
function addToCart(productId, colorId, inventoryId) {
  alert(`محصول ${productId} با رنگ ${colorId} و انبار ${inventoryId} اضافه شد`);
}
</script>

</body>
</html>
