{% load static %}

<section class="p-0 mt-5">
    <h5 class="text-center">

        <span style="color: red;letter-spacing: -4px;font-size: 20px">------</span>
        <span class="px-2">محبوب ترین برند ها</span>
        <span style="color: red;letter-spacing: -4px;font-size: 20px">------</span>
    </h5>

    <div class="row">
        <div class="ow-container container col-12">
            <div class="owl-carousel owl-theme brand-logo-slider">

                {% for brand in brands %}

                {% if brand.image %}

                <div class="ow-item h-50 w-center">
                    <a href="{% url 'shop:product-list' %}?brand={{brand.slug}}">
                        <img class="w-100" src="{{brand.image.url}}" alt="لوگوی برند {{brand.title}}">
                    </a>
                </div>
                {% endif %}

                {% endfor %}
            </div>
        </div>
    </div>

</section>
