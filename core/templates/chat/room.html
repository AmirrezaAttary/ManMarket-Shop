
<h2>چت درباره {{ chat.product.title }}</h2>

<div id="chat-box" style="border:1px solid #ccc; height:300px; overflow-y:scroll; padding:10px; margin-bottom:10px;">
    {% for msg in messages %}
        <p><strong>{{ msg.sender.username }}:</strong> {{ msg.text }}</p>
    {% endfor %}
</div>

<form method="post">
    {% csrf_token %}
    <input type="text" name="message" placeholder="پیام خود را بنویسید" style="width:80%;">
    <button type="submit">ارسال</button>
</form>
