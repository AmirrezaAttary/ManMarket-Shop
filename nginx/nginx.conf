# HTTPS SITE
upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name manmarket.ir www.manmarket.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;  # ریدایرکت کنه به HTTPS
    }
}

server {
    listen 443 ssl;
    server_name manmarket.ir www.manmarket.ir;

    ssl_certificate /etc/letsencrypt/live/manmarket.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manmarket.ir/privkey.pem;

    location /static/ {
        alias /home/app/static/;
    }

    location /media/ {
        alias /home/app/media/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
