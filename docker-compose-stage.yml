
services:
  db:
    container_name: db
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    expose:
      - 5432
    ports:
      - 5432:5432
    restart: always
    
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: ./dockerfiles/dev/django/dockerfile-stage
    command: gunicorn core.wsgi --bind 0.0.0.0:8000

    volumes:
      - ./core:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - ALLOWED_HOSTS=127.0.0.1,manmarket.ir,www.manmarket.ir
      - DEBUG=False
    expose:
      - "8000"

  nginx:
    image: nginx
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - static_volume:/home/app/static
      - media_volume:/home/app/media

  certbot:
    image: certbot/certbot
    container_name: certbot
    depends_on:
      - nginx
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet --deploy-hook \"nginx -s reload\"; done'"

  # certbot_init:
  #   image: certbot/certbot
  #   container_name: certbot_init
  #   depends_on:
  #     - nginx
  #   volumes:
  #     - certbot_conf:/etc/letsencrypt
  #     - certbot_www:/var/www/certbot
  #   command: certonly --webroot -w /var/www/certbot --force-renewal --email programmer.amirrezaattary@gmail.com -d manmarket.ir --agree-tos --no-eff-email

  redis:
    image: redis:alpine
    restart: always

  mail_front:
    image: mailu/nginx:1.9
    env_file: mailu.env
    restart: always
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
      - "143:143"
      - "110:110"
    volumes:
      - maildata:/data
      - mailstate:/state
      - mailcerts:/certs
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - redis

  mail_admin:
    image: mailu/admin:1.9
    env_file: mailu.env
    restart: always
    volumes:
      - maildata:/data
    depends_on:
      - redis

  mail_imap:
    image: mailu/dovecot:1.9
    env_file: mailu.env
    restart: always
    volumes:
      - maildata:/data
      - mailstate:/state
    depends_on:
      - redis

  mail_smtp:
    image: mailu/postfix:1.9
    env_file: mailu.env
    restart: always
    volumes:
      - maildata:/data
      - mailstate:/state
    depends_on:
      - redis



volumes:
  static_volume:
  media_volume:
  postgres_data:
  certbot_conf:
  certbot_www:
  maildata:
  mailstate:
  mailcerts:
